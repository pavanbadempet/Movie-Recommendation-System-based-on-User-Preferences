      - Admin Diagnostics
      summary: Run Testing Suite
      description: 'Triggers a PyTest suite programmatically and returns the stdout
        logs.

        In a full production environment, this would run asynchronously and

        stream results via WebSockets.'
      operationId: run_testing_suite_v1_admin_tests_run_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TestTriggerRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
