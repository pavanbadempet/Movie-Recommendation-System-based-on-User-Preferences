<svg width="1600" height="640" viewBox="0 0 1600 640" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0" y1="0" x2="1600" y2="640" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0B0F19"/>
      <stop offset="50%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#070A10"/>
    </linearGradient>

    <!-- Glowing Accent Gradients -->
    <linearGradient id="text-gradient" x1="0" y1="0" x2="800" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="50%" stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#6366F1"/>
    </linearGradient>

    <linearGradient id="accent-line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="50%" stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>

    <linearGradient id="glass-card-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="rgba(30, 41, 59, 0.7)"/>
      <stop offset="100%" stop-color="rgba(15, 23, 42, 0.8)"/>
    </linearGradient>

    <!-- Blur Filters for Glow Orbs -->
    <filter id="glow-emerald" x="-200" y="-200" width="800" height="800" filterUnits="userSpaceOnUse">
      <feGaussianBlur stdDeviation="90"/>
    </filter>
    <filter id="glow-cyan" x="800" y="-200" width="800" height="800" filterUnits="userSpaceOnUse">
      <feGaussianBlur stdDeviation="100"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="1600" height="640" rx="32" fill="url(#bg-grad)"/>

  <!-- Ambient Glow Orbs -->
  <g opacity="0.25">
    <circle cx="250" cy="150" r="220" fill="#10B981" filter="url(#glow-emerald)"/>
    <circle cx="1350" cy="200" r="250" fill="#06B6D4" filter="url(#glow-cyan)"/>
    <circle cx="800" cy="500" r="200" fill="#6366F1" filter="url(#glow-emerald)"/>
  </g>

  <!-- Outer Glass Frame -->
  <rect x="40" y="40" width="1520" height="560" rx="24" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1.5" fill="rgba(255, 255, 255, 0.015)"/>

  <!-- LEFT COLUMN: Main Branding & Specs -->
  <!-- Top Category Tag -->
  <rect x="90" y="90" width="230" height="36" rx="18" fill="rgba(16, 185, 129, 0.12)" stroke="rgba(16, 185, 129, 0.4)"/>
  <text x="120" y="114" fill="#34D399" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" letter-spacing="1.5">PRODUCTION ML ENGINE</text>

  <!-- Main Hero Title -->
  <text x="90" y="180" fill="white" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="52" font-weight="900" letter-spacing="-1">
    AI Recommendation System
  </text>

  <!-- Subtitle -->
  <text x="90" y="225" fill="url(#text-gradient)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="700">
    Causal Debiasing · Sequential Transformers · Graph Neural Networks
  </text>

  <!-- Descriptive Text -->
  <text x="90" y="270" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18">
    A high-performance recommendation platform combining 6 ML architectures
  </text>
  <text x="90" y="296" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18">
    (SASRec, KAN, LightGCN, Neural ODE) with PySpark Medallion Delta Lake ETL.
  </text>

  <!-- Tech Stack Pill Badges -->
  <g transform="translate(90, 340)">
    <!-- Bun 1.2 -->
    <rect x="0" y="0" width="120" height="38" rx="12" fill="rgba(249, 241, 225, 0.12)" stroke="rgba(249, 241, 225, 0.3)"/>
    <text x="24" y="24" fill="#F9F1E1" font-family="sans-serif" font-size="15" font-weight="700">⚡ Bun 1.2</text>

    <!-- React 19 -->
    <rect x="135" y="0" width="130" height="38" rx="12" fill="rgba(97, 218, 251, 0.12)" stroke="rgba(97, 218, 251, 0.3)"/>
    <text x="159" y="24" fill="#61DAFB" font-family="sans-serif" font-size="15" font-weight="700">⚛ React 19</text>

    <!-- PyTorch -->
    <rect x="280" y="0" width="130" height="38" rx="12" fill="rgba(238, 76, 44, 0.12)" stroke="rgba(238, 76, 44, 0.3)"/>
    <text x="304" y="24" fill="#FF7A63" font-family="sans-serif" font-size="15" font-weight="700">🔥 PyTorch</text>

    <!-- FastAPI -->
    <rect x="425" y="0" width="125" height="38" rx="12" fill="rgba(0, 150, 136, 0.12)" stroke="rgba(0, 150, 136, 0.3)"/>
    <text x="449" y="24" fill="#2DD4BF" font-family="sans-serif" font-size="15" font-weight="700">🚀 FastAPI</text>

    <!-- PySpark -->
    <rect x="565" y="0" width="135" height="38" rx="12" fill="rgba(226, 90, 28, 0.12)" stroke="rgba(226, 90, 28, 0.3)"/>
    <text x="589" y="24" fill="#FB923C" font-family="sans-serif" font-size="15" font-weight="700">⚡ PySpark</text>
  </g>

  <!-- Accent Divider Line -->
  <rect x="90" y="420" width="800" height="3" rx="1.5" fill="url(#accent-line)"/>

  <!-- Key Architecture Guarantees Grid -->
  <g transform="translate(90, 450)">
    <!-- Stat 1 -->
    <text x="0" y="30" fill="#34D399" font-family="sans-serif" font-size="28" font-weight="800">&lt; 12.5ms</text>
    <text x="0" y="52" fill="#64748B" font-family="sans-serif" font-size="14" font-weight="600">GPU SERVING LATENCY</text>

    <!-- Stat 2 -->
    <text x="240" y="30" fill="#38BDF8" font-family="sans-serif" font-size="28" font-weight="800">6 Models</text>
    <text x="240" y="52" fill="#64748B" font-family="sans-serif" font-size="14" font-weight="600">HYBRID ENSEMBLE</text>

    <!-- Stat 3 -->
    <text x="460" y="30" fill="#A78BFA" font-family="sans-serif" font-size="28" font-weight="800">DR-IPS</text>
    <text x="460" y="52" fill="#64748B" font-family="sans-serif" font-size="14" font-weight="600">CAUSAL DEBIASING</text>
  </g>

  <!-- RIGHT COLUMN: Glassmorphic Features Card -->
  <g transform="translate(960, 90)">
    <rect x="0" y="0" width="550" height="460" rx="20" fill="url(#glass-card-bg)" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1.5"/>

    <!-- Card Header -->
    <text x="36" y="50" fill="#F8FAFC" font-family="sans-serif" font-size="20" font-weight="700">Platform Capabilities</text>
    <rect x="36" y="72" width="478" height="1" fill="rgba(255, 255, 255, 0.08)"/>

    <!-- Feature Row 1 -->
    <circle cx="52" cy="115" r="6" fill="#10B981"/>
    <text x="74" y="121" fill="#E2E8F0" font-family="sans-serif" font-size="16" font-weight="600">SASRec &amp; LightGCN Graph Scoring</text>
    <text x="74" y="141" fill="#64748B" font-family="sans-serif" font-size="13">Sequential transformer self-attention + GNN embedding</text>

    <!-- Feature Row 2 -->
    <circle cx="52" cy="185" r="6" fill="#06B6D4"/>
    <text x="74" y="191" fill="#E2E8F0" font-family="sans-serif" font-size="16" font-weight="600">Kolmogorov-Arnold Network (KAN) Ranking</text>
    <text x="74" y="211" fill="#64748B" font-family="sans-serif" font-size="13">Learnable 1D B-spline activations on edges</text>

    <!-- Feature Row 3 -->
    <circle cx="52" cy="255" r="6" fill="#8B5CF6"/>
    <text x="74" y="261" fill="#E2E8F0" font-family="sans-serif" font-size="16" font-weight="600">Hardware-Aware Serving Tiers (1-3)</text>
    <text x="74" y="281" fill="#64748B" font-family="sans-serif" font-size="13">Auto-detects GPU, ONNX CPU, or SIMD vector mode</text>

    <!-- Feature Row 4 -->
    <circle cx="52" cy="325" r="6" fill="#F59E0B"/>
    <text x="74" y="331" fill="#E2E8F0" font-family="sans-serif" font-size="16" font-weight="600">Delta Lake Medallion Architecture</text>
    <text x="74" y="351" fill="#64748B" font-family="sans-serif" font-size="13">Bronze raw, Silver contracts, Gold feature vectors</text>

    <!-- Footer Badges in Card -->
    <rect x="36" y="390" width="220" height="36" rx="18" fill="rgba(16, 185, 129, 0.12)" stroke="rgba(16, 185, 129, 0.4)"/>
    <text x="65" y="413" fill="#34D399" font-family="sans-serif" font-size="14" font-weight="700">✓ Production Ready</text>

    <rect x="274" y="390" width="240" height="36" rx="18" fill="rgba(6, 182, 212, 0.12)" stroke="rgba(6, 182, 212, 0.4)"/>
    <text x="306" y="413" fill="#38BDF8" font-family="sans-serif" font-size="14" font-weight="700">⭐ Open Source MIT</text>
  </g>
</svg>
