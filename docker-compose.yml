services:
  # ---------------------------------------------------------------------------
  # 1. CORE API BACKEND (FastAPI + ML Bandits)
  # ---------------------------------------------------------------------------
  apex-backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: apex-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false
    environment:
      - ENVIRONMENT=development
      - NOVA_SERVING_PROFILE=full
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s
    networks:
      - apex-net

  # ---------------------------------------------------------------------------
  # 2. FRONTEND (React + Vite UI)
  # ---------------------------------------------------------------------------
  apex-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: apex-frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:8000
    depends_on:
      apex-backend:
        condition: service_healthy
    networks:
      - apex-net

  # ---------------------------------------------------------------------------
  # 3. HIGH-THROUGHPUT FEATURE STORE (Redis)
  # ---------------------------------------------------------------------------
  # Used for local ML Contextual Bandit state caching and LLM RAG caching
  redis:
    image: redis:7-alpine
    container_name: redis-feature-store
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server --save 60 1 --loglevel warning
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - apex-net

networks:
  apex-net:
    driver: bridge
