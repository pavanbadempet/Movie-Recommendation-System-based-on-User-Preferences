services:
  # ---------------------------------------------------------------------------
  # 1. CORE API BACKEND (FastAPI + PyTorch + FAISS + Apex Ensemble)
  # ---------------------------------------------------------------------------
  nova-backend:
    build: 
      context: .
      dockerfile: backend/Dockerfile
    container_name: nova-backend
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=production
      - NOVA_SERVING_PROFILE=full
      - KAFKA_BROKER_URL=kafka:9092
    volumes:
      - ./data:/app/data  # Share the Delta Lake with the backend
    depends_on:
      - kafka
      - spark-master
      - redis
    networks:
      - nova-net
  # ---------------------------------------------------------------------------
  # 2. FRONTEND (React + Vite UI)
  # ---------------------------------------------------------------------------
  nova-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: nova-frontend
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:8000
    networks:
      - nova-net

  # ---------------------------------------------------------------------------
  # 3. MESSAGE BROKER (Kafka for Real-Time Active Inference Stream)
  # ---------------------------------------------------------------------------
  zookeeper:
    image: confluentinc/cp-zookeeper:7.3.0
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
    networks:
      - nova-net

  kafka:
    image: confluentinc/cp-kafka:7.3.0
    container_name: kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    networks:
      - nova-net

  # ---------------------------------------------------------------------------
  # 3.5 HIGH-THROUGHPUT FEATURE STORE (Redis)
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: redis-feature-store
    ports:
      - "6379:6379"
    command: redis-server --save 60 1 --loglevel warning
    networks:
      - nova-net

  # ---------------------------------------------------------------------------
  # 4. BIG DATA COMPUTE (Distributed PySpark Cluster)
  # ---------------------------------------------------------------------------
  spark-master:
    image: bitnami/spark:3.4.1
    container_name: spark-master
    environment:
      - SPARK_MODE=master
      - SPARK_RPC_AUTHENTICATION_ENABLED=no
      - SPARK_RPC_ENCRYPTION_ENABLED=no
      - SPARK_LOCAL_STORAGE_ENCRYPTION_ENABLED=no
      - SPARK_SSL_ENABLED=no
    ports:
      - "8080:8080" # Spark UI
      - "7077:7077" # Master Port
    volumes:
      - ./data:/app/data # Mount Data Lake
      - ./scripts:/app/scripts # Mount Medallion Pipeline Scripts
    networks:
      - nova-net

  spark-worker:
    image: bitnami/spark:3.4.1
    container_name: spark-worker
    environment:
      - SPARK_MODE=worker
      - SPARK_MASTER_URL=spark://spark-master:7077
      - SPARK_WORKER_MEMORY=4G
      - SPARK_WORKER_CORES=2
      - SPARK_RPC_AUTHENTICATION_ENABLED=no
      - SPARK_RPC_ENCRYPTION_ENABLED=no
      - SPARK_LOCAL_STORAGE_ENCRYPTION_ENABLED=no
      - SPARK_SSL_ENABLED=no
    depends_on:
      - spark-master
    volumes:
      - ./data:/app/data
      - ./scripts:/app/scripts
    networks:
      - nova-net

  # ---------------------------------------------------------------------------
  # 5. RELATIONAL DATABASE (PostgreSQL for Multi-Tenancy & Auth)
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:15-alpine
    container_name: postgres-db
    environment:
      POSTGRES_USER: nova_user
      POSTGRES_PASSWORD: nova_password
      POSTGRES_DB: nova_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./sql:/docker-entrypoint-initdb.d
    networks:
      - nova-net

  # ---------------------------------------------------------------------------
  # 6. OBSERVABILITY (Prometheus + Grafana for RED Metrics)
  # ---------------------------------------------------------------------------
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    networks:
      - nova-net

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    depends_on:
      - prometheus
    networks:
      - nova-net

networks:
  nova-net:
    driver: bridge

volumes:
  postgres_data:
