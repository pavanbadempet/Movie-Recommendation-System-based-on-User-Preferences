name: Build engine-rs Python wheel

on:
  push:
    paths:
      - 'services/engine-rs/**'
  pull_request:
    paths:
      - 'services/engine-rs/**'

jobs:
  build-wheel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Set up Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          override: true
      - name: Install maturin
        run: pip install maturin
      - name: Build wheel
        working-directory: services/engine-rs
        run: maturin build --release -i python3.12
      - name: Upload wheel
        uses: actions/upload-artifact@v4
        with:
          name: engine-rs-wheel
          path: services/engine-rs/target/wheels/*.whl
