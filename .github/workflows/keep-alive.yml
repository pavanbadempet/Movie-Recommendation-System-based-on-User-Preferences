# Keep-alive workflow to prevent Render and Streamlit free tier cold starts
# Pings the services every 14 minutes to keep them warm

name: Keep Services Alive

on:
  schedule:
    # Run every 5 minutes (fastest allowed by GitHub Actions) to guarantee no cold starts
    - cron: '*/5 * * * *'
  workflow_dispatch:  # Allow manual trigger

jobs:
  ping-services:
    runs-on: ubuntu-latest
    
    steps:
      - name: Ping Render backend
        run: |
          echo "Pinging Render backend..."
          # Render free tier can take up to 2 minutes to spin up
          for i in {1..15}; do
            if curl -sf --max-time 30 "https://movie-recs-api-5qvy.onrender.com/health"; then
              echo "✅ Render backend is alive!"
              exit 0
            else
              echo "Attempt $i failed... waiting for service to wake up."
              sleep 10
            fi
          done
          echo "❌ Render backend failed to respond after 15 attempts."
          exit 1
      
      - name: Setup Python for Playwright
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Install Playwright
        run: |
          pip install playwright
          playwright install --with-deps chromium
          
      - name: Ping and Wake Streamlit App
        run: |
          echo "Checking Streamlit app status using Playwright..."
          python -c '
          from playwright.sync_api import sync_playwright
          import time
          
          def keep_awake():
              with sync_playwright() as p:
                  print("Launching headless browser...")
                  browser = p.chromium.launch(headless=True)
                  page = browser.new_page()
                  
                  # The correct URL based on the README
                  url = "https://a-movie-recommendation-system.streamlit.app/"
                  print(f"Navigating to {url}...")
                  page.goto(url)
                  
                  # Wait a few seconds to let the exact state render
                  page.wait_for_timeout(5000)
                  
                  # Check if the "Yes, get this app back up!" button exists
                  button = page.locator("button:has-text(\"Yes, get this app back up!\")")
                  if button.is_visible():
                      print("App is sleeping! Clicking the wake-up button...")
                      button.click()
                      # Wait to allow the boot process to register
                      page.wait_for_timeout(15000)
                      print("Wake-up signal sent successfully.")
                  else:
                      print("No sleep screen detected. App is awake and websocket connected!")
                      
                  browser.close()
          
          try:
              keep_awake()
          except Exception as e:
              print(f"Playwright ping failed: {e}")
              exit(1)
          '
