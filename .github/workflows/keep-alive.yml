# Keep-alive workflow to prevent Render and Streamlit free tier cold starts
# Pings the services every 14 minutes to keep them warm

name: Keep Services Alive

on:
  schedule:
    # Run every 14 minutes (free tiers typically sleep after 15min of inactivity)
    - cron: '*/14 * * * *'
  workflow_dispatch:  # Allow manual trigger

jobs:
  ping-services:
    runs-on: ubuntu-latest
    
    steps:
      - name: Ping Render backend
        run: |
          echo "Pinging Render backend..."
          for i in 1 2 3; do
            if curl -sf --max-time 30 "https://movie-recommendation-system-w0n0.onrender.com/health"; then
              echo "✅ Render backend is alive!"
              break
            else
              echo "Attempt $i failed, retrying..."
              sleep 5
            fi
          done
      
      - name: Ping Streamlit frontend
        run: |
          echo "Pinging Streamlit frontend..."
          for i in 1 2 3; do
            if curl -sf --max-time 60 "https://movie-recommendation-system-x.streamlit.app/"; then
              echo "✅ Streamlit frontend is alive!"
              break
            else
              echo "Attempt $i failed, retrying..."
              sleep 5
            fi
          done
