# Keep-alive workflow to prevent Render and Streamlit free tier cold starts
# Pings the services every 14 minutes to keep them warm

name: Keep Services Alive

on:
  schedule:
    # Run every 5 minutes (fastest allowed by GitHub Actions) to guarantee no cold starts
    - cron: '*/5 * * * *'
  workflow_dispatch:  # Allow manual trigger

jobs:
  ping-services:
    runs-on: ubuntu-latest
    
    steps:
      - name: Ping Render backend
        run: |
          echo "Pinging Render backend..."
          for i in 1 2 3; do
            if curl -sf --max-time 30 "https://movie-recs-api-5qvy.onrender.com/health"; then
              echo "✅ Render backend is alive!"
              exit 0
            else
              echo "Attempt $i failed..."
              sleep 5
            fi
          done
          echo "❌ Render backend failed to respond after 3 attempts."
          exit 1
      
      - name: Ping Streamlit frontend
        run: |
          echo "Pinging Streamlit frontend..."
          for i in 1 2 3; do
            if curl -sf --max-time 60 "https://movie-recommendation-system-x.streamlit.app/"; then
              echo "✅ Streamlit frontend is alive!"
              exit 0
            else
              echo "Attempt $i failed..."
              sleep 5
            fi
          done
          echo "❌ Streamlit frontend failed to respond after 3 attempts."
          exit 1
