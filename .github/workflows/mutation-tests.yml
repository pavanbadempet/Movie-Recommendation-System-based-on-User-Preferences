name: Mutation Testing

on:
  workflow_dispatch:
  schedule:
    - cron: '0 10 * * 1'  # Every Monday at 10:00 UTC

env:
  PYTHON_VERSION: "3.12"

jobs:
  mutation-tests:
    name: Mutation Tests (serving_tier + onnx_engine + online_learners)
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ env.PYTHON_VERSION }}
      uses: actions/setup-python@v7
      with:
        python-version: ${{ env.PYTHON_VERSION }}
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install mutmut pytest hypothesis
        pip install torch torchvision torchaudio --index-url https://download.pytorch.org/whl/cpu
        pip install -r requirements.txt

    - name: Run mutation tests — serving tier + ONNX engine
      env:
        JWT_SECRET_KEY: test-jwt-secret-key-for-ci-only
        NOVA_DISABLE_MODEL_DOWNLOADS: "1"
      run: |
        mutmut run \
          --paths-to-mutate backend/serving/serving_tier.py,backend/serving/onnx_engine.py \
          --runner "python -m pytest tests/test_serving_tier_properties.py tests/test_serving_tier_vram.py tests/test_onnx_thread_count.py -x -q"

    - name: Run mutation tests — differential privacy
      env:
        JWT_SECRET_KEY: test-jwt-secret-key-for-ci-only
        NOVA_DISABLE_MODEL_DOWNLOADS: "1"
      run: |
        mutmut run \
          --paths-to-mutate backend/privacy/privacy_preserving_ml.py \
          --runner "python -m pytest tests/test_dp_thread_safety.py -x -q"

    - name: Run mutation tests — cold-start intelligence
      env:
        JWT_SECRET_KEY: test-jwt-secret-key-for-ci-only
        NOVA_DISABLE_MODEL_DOWNLOADS: "1"
      run: |
        mutmut run \
          --paths-to-mutate backend/intelligence/uncertainty_estimator.py \
          --runner "python -m pytest tests/test_cold_start_properties.py -x -q"

    - name: Run mutation tests — online learner coordinator
      env:
        JWT_SECRET_KEY: test-jwt-secret-key-for-ci-only
        NOVA_DISABLE_MODEL_DOWNLOADS: "1"
      run: |
        mutmut run \
          --paths-to-mutate backend/learning/online_learning_coordinator.py,backend/learning/sasrec_online_learner.py,backend/learning/kan_online_learner.py \
          --runner "python -m pytest tests/test_online_learning_coordinator.py -x -q"

    - name: Print mutation score
      run: mutmut results
      if: always()
