# Daily data refresh workflow for Movie Recommendation System
# Fetches latest TMDB data from Kaggle, rebuilds embeddings, and uploads to Hugging Face

name: Daily Data Refresh

on:
  schedule:
    # Run daily at 6 AM UTC
    - cron: '0 6 * * *'
  workflow_dispatch:  # Allow manual trigger
    inputs:
      force_refresh:
        description: 'Force full data refresh'
        required: false
        default: 'false'

env:
  PYTHON_VERSION: '3.11'
  HF_REPO: 'pavanbadempet/movie-recs-models'

jobs:
  refresh-data:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install kaggle huggingface_hub

      - name: Download latest Kaggle dataset
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
        run: |
          mkdir -p data/raw
          kaggle datasets download -d alanvourch/tmdb-movies-daily-updates -p data/raw --unzip
          echo "📂 Listing all files in data/raw (Recursive):"
          ls -R data/raw/

      - name: Run ETL pipeline
        env:
          PYTHONPATH: "${{ github.workspace }}"
        run: |
          echo "🔍 Checking for files in data/raw..."
          ls -R data/raw/
          
          # Find ANY CSV file dynamically in data/raw (case-insensitive) - robust fix
          CSV_FILE=$(find data/raw -type f -iname "*.csv" | head -n 1)
          
          if [ -z "$CSV_FILE" ]; then
            echo "❌ No CSV file found in data/raw!"
            echo "Current directory contents:"
            ls -R
            exit 1
          fi
          echo "Found dataset: $CSV_FILE"
          
          python -m etl.pipeline --data "$CSV_FILE"
          echo "Generated files:"
          ls -la models/
          ls -la data/processed/

      - name: Upload embeddings to Hugging Face Hub
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python - <<EOF
          from huggingface_hub import HfApi
          import os
          
          api = HfApi()
          
          # Upload embeddings
          api.upload_file(
              path_or_fileobj="models/sbert_embeddings.npy",
              path_in_repo="sbert_embeddings.npy",
              repo_id="${{ env.HF_REPO }}",
              repo_type="model",
              token=os.environ["HF_TOKEN"]
          )
          print("✅ Uploaded sbert_embeddings.npy to Hugging Face")
          
          # Upload FAISS index
          if os.path.exists("models/faiss.index"):
              api.upload_file(
                  path_or_fileobj="models/faiss.index",
                  path_in_repo="faiss.index",
                  repo_id="${{ env.HF_REPO }}",
                  repo_type="model",
                  token=os.environ["HF_TOKEN"]
              )
              print("✅ Uploaded faiss.index to Hugging Face")
          
          # Upload parquet file (CRITICAL: must be in sync with embeddings!)
          if os.path.exists("data/processed/movies_transformed.parquet"):
              api.upload_file(
                  path_or_fileobj="data/processed/movies_transformed.parquet",
                  path_in_repo="movies_transformed.parquet",
                  repo_id="${{ env.HF_REPO }}",
                  repo_type="model",
                  token=os.environ["HF_TOKEN"]
              )
              print("✅ Uploaded movies_transformed.parquet to Hugging Face")
          EOF

      - name: Commit processed data (not embeddings)
        run: |
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"
          
          # Only commit processed parquet files (small), not embeddings (large)
          git add data/processed/
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: Daily data refresh $(date +%Y-%m-%d)"
            git push
          fi

      - name: Trigger Render redeploy (optional)
        if: success()
        run: |
          # If you have a Render deploy hook, uncomment and add it as a secret:
          # curl -X POST "RENDER_DEPLOY_HOOK_PLACEHOLDER"
          echo "✅ Pipeline complete! Render will auto-deploy on next push."

      - name: Upload artifacts for debugging
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: model-artifacts-${{ github.run_number }}
          path: |
            models/
            data/processed/
          retention-days: 7
