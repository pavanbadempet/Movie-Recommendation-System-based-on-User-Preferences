# Daily data refresh workflow for Movie Recommendation System
# Triggers Kaggle notebook (with GPU) via API push
# The notebook generates embeddings, FAISS index, and uploads ALL to HuggingFace

name: Daily Data Refresh

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/data-refresh.yml'
      - 'notebooks/kaggle_etl_pipeline.py'
      - 'scripts/validate_serving_artifacts.py'
      - 'scripts/evaluate_semantic_benchmark.py'
      - 'scripts/train_ranker.py'
      - 'backend/semantic_benchmark.py'
      - 'data/evaluation/semantic_similarity_benchmark.json'
  schedule:
    # Run daily at 6 AM UTC
    - cron: '0 6 * * *'
  workflow_dispatch:  # Allow manual trigger

env:
  PYTHON_VERSION: '3.11'

jobs:
  trigger-kaggle-notebook:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: pip install kaggle jupytext

      - name: Convert .py to .ipynb for Kaggle
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          cd notebooks
          # Inject secret into script securely
          python -c "import os; text = open('kaggle_etl_pipeline.py').read().replace('HF_TOKEN_PLACEHOLDER', os.environ.get('HF_TOKEN', '')); open('kaggle_etl_pipeline.py', 'w').write(text)"
          jupytext --to notebook kaggle_etl_pipeline.py -o kaggle_etl_pipeline.ipynb
          echo "Converted .py to .ipynb"

      - name: Push notebook to Kaggle (triggers GPU execution)
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_KEY }}
        run: |
          echo "Pushing notebook to Kaggle..."
          cd notebooks
          kaggle kernels push
          echo "Notebook pushed! Kaggle will now execute it with GPU."

      - name: Wait for Kaggle execution to complete
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_KEY }}
        run: |
          echo "Waiting for Kaggle notebook to complete..."
          KERNEL_ID="flameemperor/movie-recommendation-system-etl-pipeline"
          
          # Wait 2 minutes before first check (notebook needs time to start)
          sleep 120
          
          # Poll for completion (max 30 minutes, check every 30s)
          for i in $(seq 1 56); do
            STATUS=$(kaggle kernels status "$KERNEL_ID" 2>&1 | tail -1)
            echo "[$i/56] Status: $STATUS"
            
            if echo "$STATUS" | grep -qi "complete"; then
              echo "Kaggle notebook completed successfully!"
              kaggle kernels output "$KERNEL_ID" -p /tmp/kaggle_output || true
              echo "--- Notebook Output ---"
              cat /tmp/kaggle_output/*.log 2>/dev/null || echo "(no log file)"
              echo "--- End Output ---"
              exit 0
            fi
            
            if echo "$STATUS" | grep -qi "error\|cancel"; then
              echo "Kaggle notebook failed!"
              kaggle kernels output "$KERNEL_ID" -p /tmp/kaggle_output || true
              cat /tmp/kaggle_output/*.log 2>/dev/null || echo "(no log file)"
              exit 1
            fi
            
            sleep 30
          done
          
          echo "Timeout after 30 minutes. Check Kaggle manually:"
          echo "https://www.kaggle.com/code/$KERNEL_ID"
          exit 1

      - name: Annotate Kaggle failure
        if: failure()
        run: |
          python - <<'PY'
          from pathlib import Path

          log_paths = sorted(Path("/tmp/kaggle_output").glob("*"))
          if log_paths:
              text = "\n\n".join(
                  f"--- {path.name} ---\n{path.read_text(encoding='utf-8', errors='replace')}"
                  for path in log_paths
                  if path.is_file()
              )
          else:
              text = "Kaggle notebook failed or timed out before output logs were available."
          tail = "\n".join(text.splitlines()[-140:])
          escaped = tail[:7000].replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
          print(f"::error title=Kaggle refresh failure::{escaped}")
          PY

      - name: Validate Hugging Face serving artifact contract
        if: success()
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          pip install numpy pandas pyarrow huggingface_hub scikit-learn joblib
          python scripts/validate_serving_artifacts.py --repo pavanbadempet/movie-recs-models

      - name: Evaluate semantic recommendation benchmark
        if: success()
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          pip install numpy pandas pyarrow huggingface_hub scikit-learn joblib
          python scripts/evaluate_semantic_benchmark.py \
            --download-movies-from-hf \
            --hf-repo pavanbadempet/movie-recs-models \
            --hf-token "$HF_TOKEN" \
            --output reports/semantic_benchmark_report.json \
            --k 10 \
            --max-bad-match-rate 0.05 \
            --min-hit-rate 0.95 \
            --min-mrr 0.35 \
            --min-ndcg 0.25 \
            --fail-on-threshold

      - name: Train and upload Nova ranker
        if: success()
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          NOVA_EVENTS_URL: ${{ secrets.NOVA_EVENTS_URL }}
          NOVA_EVENT_DATABASE_URL: ${{ secrets.NOVA_EVENT_DATABASE_URL }}
        run: |
          pip install pandas pyarrow numpy scikit-learn joblib huggingface_hub "psycopg[binary]"
          EVENT_ARGS=()
          if [ -n "$NOVA_EVENTS_URL" ]; then
            EVENT_ARGS+=(--events-url "$NOVA_EVENTS_URL")
          fi
          if [ -n "$NOVA_EVENT_DATABASE_URL" ]; then
            export NOVA_EVENT_STORE=postgres
          fi
          python scripts/train_ranker.py \
            --download-movies-from-hf \
            --upload-to-hf \
            --promotion-gate \
            --hf-repo pavanbadempet/movie-recs-models \
            --output models/nova_ranker.candidate.joblib \
            --production-output models/nova_ranker.joblib \
            "${EVENT_ARGS[@]}"

      - name: Trigger Render backend restart
        if: success()
        run: |
          echo "Pinging Render to pick up new HuggingFace artifacts..."
          curl -sf --max-time 60 "https://movie-recs-api-5qvy.onrender.com/health" || echo "Backend pinged (may be sleeping)"
          echo "Done! Backend will download new files on next cold start."
