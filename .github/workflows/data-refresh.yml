# Daily data refresh workflow for Movie Recommendation System
# Triggers Kaggle notebook (with GPU) via API push, which uploads to HuggingFace

name: Daily Data Refresh

on:
  schedule:
    # Run daily at 6 AM UTC
    - cron: '0 6 * * *'
  workflow_dispatch:  # Allow manual trigger

jobs:
  trigger-kaggle-notebook:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Kaggle credentials
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
        run: |
          mkdir -p ~/.kaggle
          echo '{"username":"'$KAGGLE_USERNAME'","key":"'$KAGGLE_KEY'"}' > ~/.kaggle/kaggle.json
          chmod 600 ~/.kaggle/kaggle.json

      - name: Install Kaggle CLI
        run: pip install kaggle

      - name: Push notebook to Kaggle (triggers GPU execution)
        run: |
          echo "🚀 Pushing notebook to Kaggle to trigger execution..."
          cd notebooks
          
          # Push the notebook - this triggers a run on Kaggle
          kaggle kernels push
          
          echo "✅ Notebook pushed! Kaggle will now execute it with GPU."
          echo ""
          echo "The notebook will:"
          echo "  1. Load TMDB dataset from Kaggle"
          echo "  2. Generate embeddings using sentence-transformers (GPU accelerated)"
          echo "  3. Build HNSW FAISS index"
          echo "  4. Upload ALL artifacts to HuggingFace"

      - name: Wait for Kaggle execution to complete
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
        run: |
          echo "⏳ Waiting for Kaggle notebook to complete..."
          KERNEL_ID="flameemperor/movie-recommendation-system-etl-pipeline"
          
          # Poll for completion (max 30 minutes)
          for i in {1..60}; do
            STATUS=$(kaggle kernels status $KERNEL_ID 2>&1 | tail -1)
            echo "[$i/60] Status: $STATUS"
            
            if echo "$STATUS" | grep -q "complete"; then
              echo "✅ Kaggle notebook completed successfully!"
              exit 0
            elif echo "$STATUS" | grep -q "error\|failed"; then
              echo "❌ Kaggle notebook failed!"
              kaggle kernels output $KERNEL_ID -p /tmp/kaggle_output || true
              cat /tmp/kaggle_output/*.log 2>/dev/null || true
              exit 1
            fi
            
            sleep 30  # Check every 30 seconds
          done
          
          echo "⚠️ Timeout waiting for Kaggle. Check manually at:"
          echo "https://www.kaggle.com/code/$KERNEL_ID"

      - name: Trigger Render backend restart
        if: success()
        run: |
          echo "🔄 Pinging Render to pick up new HuggingFace artifacts..."
          curl -sf --max-time 60 "https://movie-recs-api-5qvy.onrender.com/health" || echo "Backend pinged"
          echo "✅ Done! Backend will download new files on next cold start."
