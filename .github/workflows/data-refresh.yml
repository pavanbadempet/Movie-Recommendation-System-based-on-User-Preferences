# Daily data refresh workflow for Movie Recommendation System
# Triggers Kaggle notebook to regenerate embeddings and upload to Hugging Face

name: Daily Data Refresh

on:
  schedule:
    # Run daily at 6 AM UTC
    - cron: '0 6 * * *'
  workflow_dispatch:  # Allow manual trigger

env:
  KAGGLE_NOTEBOOK: flameemperor/movie-recommendation-system-etl-pipeline

jobs:
  trigger-kaggle:
    runs-on: ubuntu-latest
    
    steps:
      - name: Setup Kaggle credentials
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
        run: |
          mkdir -p ~/.kaggle
          echo "{\"username\":\"$KAGGLE_USERNAME\",\"key\":\"$KAGGLE_KEY\"}" > ~/.kaggle/kaggle.json
          chmod 600 ~/.kaggle/kaggle.json

      - name: Install Kaggle CLI
        run: pip install kaggle

      - name: Trigger Kaggle notebook execution
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
        run: |
          echo "🚀 Triggering Kaggle notebook: ${{ env.KAGGLE_NOTEBOOK }}"
          
          # Push a new version to trigger execution
          # The notebook has "Run on Schedule" or we force-run it
          kaggle kernels push -p . || echo "Push not applicable for existing kernel"
          
          # Alternative: Use Kaggle API to check status
          echo "Checking notebook status..."
          kaggle kernels status ${{ env.KAGGLE_NOTEBOOK }} || echo "Status check done"
          
          echo "✅ Kaggle notebook triggered!"
          echo "The notebook will:"
          echo "  1. Load latest TMDB data from Kaggle dataset"
          echo "  2. Generate BGE-M3 embeddings (1024d) on GPU"
          echo "  3. Build HNSW FAISS index"
          echo "  4. Upload all artifacts to HuggingFace"
          
      - name: Wait for Kaggle execution (optional monitoring)
        run: |
          echo "⏳ Kaggle notebook runs asynchronously."
          echo "Monitor progress at: https://www.kaggle.com/code/${{ env.KAGGLE_NOTEBOOK }}"
          echo "HuggingFace artifacts will be updated after notebook completes (~10-15 min)."

  # Trigger Render redeploy after Kaggle completes (delayed)
  trigger-redeploy:
    runs-on: ubuntu-latest
    needs: trigger-kaggle
    
    steps:
      - name: Wait for Kaggle to complete
        run: |
          echo "⏳ Waiting 15 minutes for Kaggle notebook to complete..."
          sleep 900  # 15 minutes
          
      - name: Ping Render to trigger redeploy
        run: |
          echo "🔄 Pinging Render backend to pick up new HuggingFace artifacts..."
          # The backend's model_loader.py will download fresh files on next cold start
          curl -sf "https://movie-recs-api-5qvy.onrender.com/health" || echo "Backend pinged"
          echo "✅ Done! Backend will use new artifacts on next restart."
