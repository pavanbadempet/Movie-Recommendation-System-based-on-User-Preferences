name: Synthetic Monitoring

on:
  workflow_run:
    workflows: ["Sync to Hugging Face Hub"]
    types:
      - completed
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

concurrency:
  group: synthetic-monitoring-${{ github.ref }}
  cancel-in-progress: true

jobs:
  synthetic-monitoring:
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    timeout-minutes: 30
    env:
      NOVA_SERVING_URL: https://pavanbadempet-movie-rec-api.hf.space
      NOVA_RENDER_GATEWAY_URL: https://movie-recs-api-5qvy.onrender.com
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Probe live product paths
        run: >-
          python scripts/synthetic_monitor.py
          --base-url "$NOVA_SERVING_URL"
          --base-url "$NOVA_RENDER_GATEWAY_URL"
          --timeout 45
          --retries 20
          --retry-delay-seconds 30
          --output reports/synthetic_monitor.json
          --fail-on-error

      - name: Upload monitor report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: synthetic-monitor-report
          path: reports/synthetic_monitor.json
          if-no-files-found: ignore
