name: Frontend CI (Bun)

on:
  push:
    paths:
      - 'frontend/**'
  pull_request:
    paths:
      - 'frontend/**'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1

      - name: Install dependencies (bun)
        working-directory: frontend
        run: bun install

      - name: Run type check
        working-directory: frontend
        run: bun run type-check

      - name: Build
        working-directory: frontend
        run: bun run build

      - name: Run unit tests
        working-directory: frontend
        run: bun run test
