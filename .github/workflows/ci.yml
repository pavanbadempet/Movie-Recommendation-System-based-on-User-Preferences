# Continuous Integration Workflow
# Runs tests and linting on every push and PR

name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  PYTHON_VERSION: '3.11'

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff

      - name: Lint with ruff
        run: ruff check . --ignore=E501,F401,E402,F541 --exclude=.venv,.venv_cuda,notebooks

      - name: Run tests
        shell: bash
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
        run: |
          set +e
          pytest tests/ -v --tb=short 2>&1 | tee pytest-output.txt
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            python - <<'PY'
          from pathlib import Path

          text = Path("pytest-output.txt").read_text(encoding="utf-8", errors="replace")
          lines = text.splitlines()
          failure_start = 0
          for idx, line in enumerate(lines):
              if line.startswith("================================== FAILURES"):
                  failure_start = idx
                  break
          tail = "\n".join(lines[failure_start:][-120:])
          escaped = tail[:7000].replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
          print(f"::error title=Pytest failure::{escaped}")
          PY
          fi
          exit "$status"

  build:
    runs-on: ubuntu-latest
    needs: test
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Verify imports
        run: |
          python -c "from backend.main import app; print('Backend OK')"
          python -c "from etl.pipeline import run_pipeline; print('ETL OK')"
