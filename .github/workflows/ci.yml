name: Nova Universal Recommendation Engine CI/CD

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main" ]

env:
  PYTHON_VERSION: "3.11"
  NODE_VERSION: "24"

jobs:
  backend-tests:
    name: Backend PyTorch & PySpark Tests
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python ${{ env.PYTHON_VERSION }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}
        cache: 'pip'
        
    - name: Install System Dependencies (Java for PySpark)
      run: |
        sudo apt-get update
        sudo apt-get install -y default-jre
        
    - name: Install Python Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest pytest-cov
        pip install torch torchvision torchaudio --index-url https://download.pytorch.org/whl/cpu
        pip install -r requirements.txt
        pip install -r requirements-etl.txt
        
    - name: Run Backend Regression Tests
      run: |
        python -m pytest tests/test_api.py backend/tests/test_ensemble_math.py backend/tests/test_multimodal.py tests/test_pyspark_scd.py -q

  frontend-tests:
    name: Frontend React Build & Lint
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Use Node.js ${{ env.NODE_VERSION }}
      uses: actions/setup-node@v3
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json
        
    - name: Install NPM dependencies
      working-directory: ./frontend
      run: npm ci
      
    - name: Run Linter
      working-directory: ./frontend
      run: npm run lint --if-present
      
    - name: Build React Application
      working-directory: ./frontend
      run: npm run build

  docker-integration:
    name: Docker Compose Integration Build
    needs: [backend-tests, frontend-tests]
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Verify Docker Compose Build
      run: |
        echo "Validating Docker Compose configuration..."
        docker compose config
        echo "Docker orchestration validated."
