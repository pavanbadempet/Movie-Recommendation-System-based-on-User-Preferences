name: Sync to Hugging Face Hub

on:
  push:
    branches:
      - main
  workflow_dispatch: # Allow manual triggering

jobs:
  sync-to-hub:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
          lfs: false
          
      - name: Track Large Files with LFS
        run: |
          git lfs install
          # Remove existing .gitattributes restriction if any
          git rm --cached .gitattributes || true
          # Track parquet files with LFS
          git lfs track "*.parquet"
          # Convert existing large files to LFS pointer files
          git add .gitattributes
          git add data/processed/*.parquet
          git commit -m "chore: Track large parquet files with Git LFS for Hugging Face" || echo "No changes to commit"
          
      - name: Push to Hugging Face
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          git push --force https://pavanbadempet:$HF_TOKEN@huggingface.co/spaces/pavanbadempet/movie-rec-api main
