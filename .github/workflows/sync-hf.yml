name: Sync to Hugging Face Hub

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  sync-to-hub:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          lfs: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install huggingface_hub

      - name: Validate Python syntax before Space sync
        run: python -m compileall backend etl airflow scripts frontend/streamlit_app.py manage.py tests

      - name: Stamp app revision
        run: echo "${GITHUB_SHA}" > REVISION

      - name: Deploy to Hugging Face Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python -c "
          import os
          from huggingface_hub import HfApi
          api = HfApi(token=os.environ['HF_TOKEN'])
          print('Uploading repository to Hugging Face Spaces...')
          api.upload_folder(
              folder_path='.',
              repo_id='pavanbadempet/movie-rec-api',
              repo_type='space',
              ignore_patterns=[
                  '.git/*',
                  '.github/*',
                  'models/*.npy',
                  'models/*.index',
                  'models/*.joblib',
                  'models/*.joblib.metadata.json',
                  'models/pipeline_manifest.json',
                  'backend/models/*.index',
                  'backend/models/*.npy',
                  'backend/models/*.joblib',
                  'backend/models/*.joblib.metadata.json',
                  'backend/models/pipeline_manifest.json',
                  'data/processed/*.parquet',
                  'data/bronze/*',
                  'data/silver/*',
                  'data/gold/*',
                  'data/manifests/*',
                  'data/quality/*',
              ]
          )
          print('Upload complete!')
          "
