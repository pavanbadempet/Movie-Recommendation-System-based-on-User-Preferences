apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-apex
  labels:
    app.kubernetes.io/name: apex
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/version: {{ .Chart.AppVersion | quote }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: apex
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: apex
        app.kubernetes.io/instance: {{ .Release.Name }}
      annotations:
        # Force pod restart when ConfigMap changes
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: apex
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          envFrom:
            - configMapRef:
                name: {{ .Release.Name }}-apex-config
          env:
            - name: NOVA_SERVING_TIER
              value: {{ .Values.servingTier | quote }}
            - name: NOVA_SERVING_PROFILE
              value: {{ .Values.servingProfile | quote }}
            - name: APEX_DP_EPSILON
              value: {{ .Values.dpEpsilon | quote }}
            {{- if .Values.secretRefs.jwtSecretKey }}
            - name: JWT_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: apex-secrets
                  key: {{ .Values.secretRefs.jwtSecretKey }}
            {{- end }}
            {{- if .Values.secretRefs.tmdbApiKey }}
            - name: TMDB_API_KEY
              valueFrom:
                secretKeyRef:
                  name: apex-secrets
                  key: {{ .Values.secretRefs.tmdbApiKey }}
            {{- end }}
            {{- if .Values.secretRefs.adminToken }}
            - name: NOVA_ADMIN_TOKEN
              valueFrom:
                secretKeyRef:
                  name: apex-secrets
                  key: {{ .Values.secretRefs.adminToken }}
            {{- end }}
            {{- if .Values.secretRefs.openrouterApiKey }}
            - name: OPENROUTER_API_KEY
              valueFrom:
                secretKeyRef:
                  name: apex-secrets
                  key: {{ .Values.secretRefs.openrouterApiKey }}
            {{- end }}
            {{- if .Values.secretRefs.sentryDsn }}
            - name: SENTRY_DSN
              valueFrom:
                secretKeyRef:
                  name: apex-secrets
                  key: {{ .Values.secretRefs.sentryDsn }}
            {{- end }}
            {{- if .Values.secretRefs.redisUrl }}
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: apex-secrets
                  key: {{ .Values.secretRefs.redisUrl }}
            {{- end }}
            {{- if .Values.secretRefs.databaseUrl }}
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: apex-secrets
                  key: {{ .Values.secretRefs.databaseUrl }}
            {{- end }}
            {{- range $key, $value := .Values.extraEnv }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
          # Startup probe: allows up to ~130 seconds for model artifact warmup
          # before liveness kicks in. Critical for Tier1/Tier2 cold starts.
          startupProbe:
            httpGet:
              path: {{ .Values.probes.startup.path }}
              port: 8000
            initialDelaySeconds: {{ .Values.probes.startup.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.startup.periodSeconds }}
            failureThreshold: {{ .Values.probes.startup.failureThreshold }}
            timeoutSeconds: {{ .Values.probes.startup.timeoutSeconds }}
          livenessProbe:
            httpGet:
              path: {{ .Values.probes.liveness.path }}
              port: 8000
            initialDelaySeconds: {{ .Values.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.liveness.periodSeconds }}
            failureThreshold: {{ .Values.probes.liveness.failureThreshold }}
            timeoutSeconds: {{ .Values.probes.liveness.timeoutSeconds }}
          readinessProbe:
            httpGet:
              path: {{ .Values.probes.readiness.path }}
              port: 8000
            initialDelaySeconds: {{ .Values.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.readiness.periodSeconds }}
            failureThreshold: {{ .Values.probes.readiness.failureThreshold }}
            timeoutSeconds: {{ .Values.probes.readiness.timeoutSeconds }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
