apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-apex-config
  labels:
    app.kubernetes.io/name: apex
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
data:
  ENVIRONMENT: "production"
  # Serving tier is set directly in deployment.yaml env — not here, since it's
  # a deployment-level concern. Platform config belongs in the ConfigMap.
  NOVA_HEALTH_LOAD_RECOMMENDER: "true"
  NOVA_BACKGROUND_RECOMMENDER_WARMUP: "true"
  NOVA_ASYNC_EVALUATION_CACHE: "true"
  NOVA_REFRESH_PIPELINE_MANIFEST: "true"
  # SLO thresholds
  NOVA_SLO_WINDOW_SECONDS: "3600"
  NOVA_SLO_MIN_REQUESTS: "5"
  NOVA_SLO_MIN_ROUTE_REQUESTS: "20"
  NOVA_SLO_LATENCY_P95_MS: "2500"
  NOVA_SLO_ERROR_RATE: "0.03"
  NOVA_SLO_MAX_EVENTS: "5000"
  # Recommender cache
  NOVA_RECOMMENDER_CACHE_ENABLED: "true"
  NOVA_RECOMMENDER_CACHE_MAX_ENTRIES: "512"
  NOVA_RECOMMENDER_CACHE_TTL_SECONDS: "300"
  # Circuit breaker
  NOVA_RECOMMENDER_CIRCUIT_FAILURE_THRESHOLD: "3"
  NOVA_RECOMMENDER_CIRCUIT_OPEN_SECONDS: "60"
