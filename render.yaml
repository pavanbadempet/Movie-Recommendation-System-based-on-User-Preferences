services:
  - type: web
    name: nova-backend
    env: docker
    dockerContext: .
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: NOVA_SERVING_PROFILE
        value: lite
      - key: NOVA_HEALTH_LOAD_RECOMMENDER
        value: "false"
      - key: NOVA_BACKGROUND_RECOMMENDER_WARMUP
        value: "false"
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
