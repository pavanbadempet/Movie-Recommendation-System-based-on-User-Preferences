services:
  - type: web
    name: movie-recs-api
    plan: free
    region: singapore
    autoDeploy: true
    # Updated: 2026-01-29 - Model files now hosted on Hugging Face
    healthCheckPath: /health
    buildFilter:
      paths:
        - backend/**
        - requirements.txt
        - render.yaml
      ignoredPaths:
        - streamlit_app.py
        - docs/**
        - legacy/**
        - .github/**
        - README.md
    env: python
    buildCommand: >-
      python -c "import os, pathlib; sha=os.getenv('RENDER_GIT_COMMIT') or os.getenv('SOURCE_VERSION') or ''; pathlib.Path('REVISION').write_text(sha, encoding='utf-8') if sha else None"
      && pip install --upgrade pip
      && pip install -r requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: NOVA_SERVING_PROFILE
        value: lite
      - key: NOVA_HEALTH_LOAD_RECOMMENDER
        value: false
      - key: NOVA_TFIDF_MAX_FEATURES
        value: 12000
      - key: NOVA_ITEM_TFIDF_MAX_FEATURES
        value: 18000
      - key: NOVA_ENABLE_LEARNED_RANKER
        value: auto
      - key: NOVA_MIN_RANKER_FEEDBACK_ITEMS
        value: 100
      - key: NOVA_ALLOW_LEGACY_ROW_ALIGNED_VECTORS
        value: false
      - key: NOVA_REFRESH_PIPELINE_MANIFEST
        value: true
      - key: NOVA_ENABLE_LLM_RERANK
        value: false
      - key: NOVA_RECOMMENDER_SERVICE_URL
        value: https://pavanbadempet-movie-rec-api.hf.space
      - key: NOVA_RECOMMENDER_SERVICE_TIMEOUT_SECONDS
        value: 20
      - key: NOVA_FRONTEND_PRIORITY
        value: streamlit,react
      - key: NOVA_FRONTEND_STREAMLIT_URL
        value: https://a-movie-recommendation-system.streamlit.app
      - key: NOVA_FRONTEND_REACT_URL
        value: /ui/
      - key: NOVA_FRONTEND_HEALTH_TIMEOUT_SECONDS
        value: 2.5
      - key: NOVA_FRONTEND_HEALTH_CACHE_SECONDS
        value: 30
      - key: TMDB_API_KEY
        sync: false


