services:
  - type: web
    name: apex-backend
    env: docker
    dockerContext: .
    dockerfilePath: ./Dockerfile
    # ---------------------------------------------------------------------------
    # Tier 3 — reproducible source deployment using tracked/downloaded FAISS artifacts.
    # Select Tier 2 only after publishing the required ONNX model set.
    # ---------------------------------------------------------------------------
    plan: free
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: production
      # Clean source deployments do not contain ONNX binaries.
      - key: NOVA_SERVING_PROFILE
        value: lite
      - key: NOVA_SERVING_TIER
        value: tier3
      # Background warmup enabled — model artifacts loaded before first request
      - key: NOVA_HEALTH_LOAD_RECOMMENDER
        value: "true"
      - key: NOVA_BACKGROUND_RECOMMENDER_WARMUP
        value: "true"
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      # JWT_SECRET_KEY must be set in the Render dashboard — never committed
      - key: JWT_SECRET_KEY
        sync: false
      # NOVA_ADMIN_TOKEN must be set in the Render dashboard — never committed
      - key: NOVA_ADMIN_TOKEN
        sync: false
      # Optional: Stripe keys for billing (set in Render dashboard)
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      # Optional: Sentry for error monitoring (set in Render dashboard)
      - key: SENTRY_DSN
        sync: false

