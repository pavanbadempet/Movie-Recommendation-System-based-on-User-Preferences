services:
  - type: web
    name: movie-recs-api
    plan: free
    region: singapore
    autoDeploy: true
    # Updated: 2026-01-29 - Model files now hosted on Hugging Face
    healthCheckPath: /health
    buildFilter:
      paths:
        - backend/**
        - models/**
        - data/processed/**
        - requirements.txt
        - render.yaml
      ignoredPaths:
        - streamlit_app.py
        - docs/**
        - legacy/**
        - .github/**
        - README.md
    env: python
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: NOVA_SERVING_PROFILE
        value: lite
      - key: NOVA_HEALTH_LOAD_RECOMMENDER
        value: false
      - key: NOVA_TFIDF_MAX_FEATURES
        value: 12000
      - key: NOVA_ENABLE_LLM_RERANK
        value: false
      - key: NOVA_RECOMMENDER_SERVICE_URL
        value: https://pavanbadempet-movie-rec-api.hf.space
      - key: NOVA_RECOMMENDER_SERVICE_TIMEOUT_SECONDS
        value: 20
      - key: TMDB_API_KEY
        sync: false


