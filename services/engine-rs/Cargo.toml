[package]
name = "engine_rs"
version = "0.1.0"
edition = "2021"

[lib]
name = "engine_rs"
crate-type = ["cdylib", "rlib"]

[features]
python = ["pyo3"]

[dependencies]
axum = "0.8"
tokio = { version = "1.44", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
mimalloc = "0.1"
rayon = "1.8"
hyper = { version = "0.14", features = ["full"] }

# Optional Python bindings for embedding this library into Python via PyO3
pyo3 = { version = "0.20", features = ["extension-module"], optional = true }
