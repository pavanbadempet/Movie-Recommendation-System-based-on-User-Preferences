# Docker Compose for Movie Recommendation System with Kafka Cluster
# Run: docker-compose -f docker-compose.kafka-cluster.yml up -d

version: "3.8"

x-airflow-common: &airflow-common
  image: apache/airflow:2.8.0-python3.11
  environment:
    - AIRFLOW__CORE__EXECUTOR=LocalExecutor
    - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://airflow:airflow@postgres/airflow
    - AIRFLOW__CORE__FERNET_KEY=${FERNET_KEY}
    - AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION=false
    - AIRFLOW__CORE__LOAD_EXAMPLES=false
    - AIRFLOW__WEBSERVER__EXPOSE_CONFIG=true
    - AIRFLOW_ADMIN_USERNAME=${AIRFLOW_ADMIN_USERNAME:?set AIRFLOW_ADMIN_USERNAME}
    - AIRFLOW_ADMIN_PASSWORD=${AIRFLOW_ADMIN_PASSWORD:?set AIRFLOW_ADMIN_PASSWORD}
    - KAGGLE_USERNAME=${KAGGLE_USERNAME}
    - KAGGLE_KEY=${KAGGLE_KEY}
    - TMDB_API_KEY=${TMDB_API_KEY}
  volumes:
    - ./airflow/dags:/opt/airflow/dags
    - ./airflow/logs:/opt/airflow/logs
    - ./:/opt/airflow/movie-rec
    - airflow-kaggle:/root/.kaggle
  depends_on:
    postgres:
      condition: service_healthy
  networks:
    - default

services:
  postgres:
    image: postgres:15
    environment:
      - POSTGRES_USER=airflow
      - POSTGRES_PASSWORD=airflow
      - POSTGRES_DB=airflow
    volumes:
      - postgres-db:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD", "pg_isready", "-U", "airflow" ]
      interval: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - default

  airflow-init:
    <<: *airflow-common
    container_name: airflow-init
    entrypoint: ["/bin/bash"]
    command:
      - -c
      - |
        set -euo pipefail
        : "$${AIRFLOW_ADMIN_USERNAME:?set AIRFLOW_ADMIN_USERNAME}"
        : "$${AIRFLOW_ADMIN_PASSWORD:?set AIRFLOW_ADMIN_PASSWORD}"
        pip install kaggle faiss-cpu scikit-learn pandas pyarrow pandera joblib pyspark kafka-python delta-spark
        airflow db migrate
        airflow users create \
          --username "$$AIRFLOW_ADMIN_USERNAME" \
          --password "$$AIRFLOW_ADMIN_PASSWORD" \
          --firstname Admin \
          --lastname User \
          --role Admin \
          --email admin@example.com \
          || airflow users list | grep -F "$$AIRFLOW_ADMIN_USERNAME"
        mkdir -p /root/.kaggle
        printf '{"username":"%s","key":"%s"}\n' "$$KAGGLE_USERNAME" "$$KAGGLE_KEY" > /root/.kaggle/kaggle.json
        chmod 600 /root/.kaggle/kaggle.json
    restart: "no"

  airflow-webserver:
    <<: *airflow-common
    container_name: airflow-webserver
    command: bash -c "pip install kaggle faiss-cpu scikit-learn pandas pyarrow pandera joblib pyspark kafka-python delta-spark && airflow webserver"
    ports:
      - "127.0.0.1:8080:8080"
    healthcheck:
      test: [ "CMD", "curl", "--fail", "http://localhost:8080/health" ]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: unless-stopped

  airflow-scheduler:
    <<: *airflow-common
    container_name: airflow-scheduler
    command: bash -c "pip install kaggle faiss-cpu scikit-learn pandas pyarrow pandera joblib pyspark sentence-transformers httpx kafka-python delta-spark && airflow scheduler"
    healthcheck:
      test: [ "CMD-SHELL", "airflow jobs check --job-type SchedulerJob --hostname $(hostname)" ]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: unless-stopped

  # Kafka Cluster for event streaming (Bronze Layer)
  kafka-1:
    image: bitnami/kafka:3.6
    container_name: kafka-1
    ports:
      - "127.0.0.1:9092:9092"
    environment:
      - KAFKA_CFG_NODE_ID=1
      - KAFKA_CFG_PROCESS_ROLES=controller,broker
      - KAFKA_CFG_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093
      - KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      - KAFKA_CFG_CONTROLLER_QUORUM_VOTERS=1@kafka-1:9093,2@kafka-2:9093,3@kafka-3:9093
      - KAFKA_CFG_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_CFG_ADVERTISED_LISTENERS=PLAINTEXT://kafka-1:9092
      - KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE=false
      - KAFKA_CFG_BROKER_ID=1
      - KAFKA_CFG_INTER_BROKER_LISTENER_NAME=PLAINTEXT
      - KAFKA_CFG_DEFAULT_REPLICATION_FACTOR=2
      - KAFKA_CFG_OFFSETS_TOPIC_REPLICATION_FACTOR=2
      - KAFKA_CFG_TRANSACTION_STATE_LOG_REPLICATION_FACTOR=2
      - KAFKA_CFG_TRANSACTION_STATE_LOG_MIN_ISR=2
      - KAFKA_CFG_MIN_INSYNC_REPLICAS=1
      - KAFKA_CFG_NUM_PARTITIONS=3
    volumes:
      - kafka-data-1:/bitnami/kafka
    healthcheck:
      test: ["CMD", "kafka-topics.sh", "--bootstrap-server", "localhost:9092", "--list"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - default

  kafka-2:
    image: bitnami/kafka:3.6
    container_name: kafka-2
    ports:
      - "127.0.0.1:9093:9092"
    environment:
      - KAFKA_CFG_NODE_ID=2
      - KAFKA_CFG_PROCESS_ROLES=controller,broker
      - KAFKA_CFG_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093
      - KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      - KAFKA_CFG_CONTROLLER_QUORUM_VOTERS=1@kafka-1:9093,2@kafka-2:9093,3@kafka-3:9093
      - KAFKA_CFG_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_CFG_ADVERTISED_LISTENERS=PLAINTEXT://kafka-2:9092
      - KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE=false
      - KAFKA_CFG_BROKER_ID=2
      - KAFKA_CFG_INTER_BROKER_LISTENER_NAME=PLAINTEXT
      - KAFKA_CFG_DEFAULT_REPLICATION_FACTOR=2
      - KAFKA_CFG_OFFSETS_TOPIC_REPLICATION_FACTOR=2
      - KAFKA_CFG_TRANSACTION_STATE_LOG_REPLICATION_FACTOR=2
      - KAFKA_CFG_TRANSACTION_STATE_LOG_MIN_ISR=2
      - KAFKA_CFG_MIN_INSYNC_REPLICAS=1
      - KAFKA_CFG_NUM_PARTITIONS=3
    volumes:
      - kafka-data-2:/bitnami/kafka
    healthcheck:
      test: ["CMD", "kafka-topics.sh", "--bootstrap-server", "localhost:9092", "--list"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - default

  kafka-3:
    image: bitnami/kafka:3.6
    container_name: kafka-3
    ports:
      - "127.0.0.1:9094:9092"
    environment:
      - KAFKA_CFG_NODE_ID=3
      - KAFKA_CFG_PROCESS_ROLES=controller,broker
      - KAFKA_CFG_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093
      - KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      - KAFKA_CFG_CONTROLLER_QUORUM_VOTERS=1@kafka-1:9093,2@kafka-2:9093,3@kafka-3:9093
      - KAFKA_CFG_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_CFG_ADVERTISED_LISTENERS=PLAINTEXT://kafka-3:9092
      - KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE=false
      - KAFKA_CFG_BROKER_ID=3
      - KAFKA_CFG_INTER_BROKER_LISTENER_NAME=PLAINTEXT
      - KAFKA_CFG_DEFAULT_REPLICATION_FACTOR=2
      - KAFKA_CFG_OFFSETS_TOPIC_REPLICATION_FACTOR=2
      - KAFKA_CFG_TRANSACTION_STATE_LOG_REPLICATION_FACTOR=2
      - KAFKA_CFG_TRANSACTION_STATE_LOG_MIN_ISR=2
      - KAFKA_CFG_MIN_INSYNC_REPLICAS=1
      - KAFKA_CFG_NUM_PARTITIONS=3
    volumes:
      - kafka-data-3:/bitnami/kafka
    healthcheck:
      test: ["CMD", "kafka-topics.sh", "--bootstrap-server", "localhost:9092", "--list"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - default

  # Kafka UI for monitoring and management
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    ports:
      - "127.0.0.1:8082:8080"
    environment:
      - KAFKA_CLUSTERS_0_NAME=local
      - KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS=kafka-1:9092,kafka-2:9092,kafka-3:9092
      - KAFKA_CLUSTERS_0_ZOOKEEPER=  # Not needed for KRaft mode
    depends_on:
      - kafka-1
      - kafka-2
      - kafka-3
    restart: unless-stopped
    networks:
      - default

  # Movie Recommendation Backend
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: movie-rec-backend
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./data:/app/data
      - ./models:/app/models
    environment:
      - TMDB_API_KEY=${TMDB_API_KEY}
    command: uvicorn backend.main:app --host 0.0.0.0 --port 8000
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8000/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
    networks:
      - default

  # Spark for distributed processing
  spark:
    image: bitnami/spark:3.5
    container_name: spark
    environment:
      - SPARK_MODE=standalone
      - SPARK_RPC_AUTHENTICATION_ENABLED=no
      - SPARK_RPC_ENCRYPTION_ENABLED=no
      - SPARK_LOCAL_STORAGE_ENCRYPTION_ENABLED=no
      - SPARK_SSL_ENABLED=no
      - SPARK_MASTER_HOST=spark
      - SPARK_MASTER_WEBUI_PORT=8080
    ports:
      - "127.0.0.1:8081:8080"  # Spark UI
      - "127.0.0.1:7077:7077"  # Spark master port
    volumes:
      - spark-data:/bitnami/spark
      - ./data:/opt/bitnami/spark/data
      - ./models:/opt/bitnami/spark/models
      - ./:/opt/bitnami/spark/movie-rec
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    depends_on:
      - kafka-1
      - kafka-2
      - kafka-3
    networks:
      - default

  # Movie Recommendation Frontend
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: movie-rec-frontend
    ports:
      - "127.0.0.1:8501:8501"
    volumes:
      - ./data:/app/data
      - ./models:/app/models
    environment:
      - API_BASE_URL=http://backend:8000
    command: streamlit run frontend/streamlit_app.py --server.port 8501 --server.address 0.0.0.0
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - default

volumes:
  postgres-db:
  airflow-kaggle:
  kafka-data-1:
  kafka-data-2:
  kafka-data-3:
  spark-data:

networks:
  default:
    driver: bridge
