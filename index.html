  <style>
    :root {
      --bg: #0b0c10;
      --text: #c5c6c7;
      --text-highlight: #66fcf1;
      --accent: #45f3ff;
      --border: rgba(102, 252, 241, 0.1);
    }
    body {
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
    }
    .container {
      max-width: 480px;
      padding: 2.5rem;
      border: 1px solid var(--border);
      background: rgba(255, 255, 255, 0.01);
      border-radius: 16px;
      backdrop-filter: blur(10px);
      box-shadow: 0 4px 30px rgba(0, 0, 0, 0.6);
    }
    h1 {
      margin: 0 0 0.5rem 0;
      font-size: 1.6rem;
      font-weight: 800;
      letter-spacing: -0.025em;
      text-transform: uppercase;
      color: #ffffff;
    }
    .highlight {
      color: var(--text-highlight);
    }
    p {
      margin: 0 0 1.5rem 0;
      color: #8f9499;
      font-size: 0.95rem;
      line-height: 1.6;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background-color: var(--text-highlight);
      color: #0b0c10;
      padding: 0.75rem 1.75rem;
      font-size: 0.9rem;
      font-weight: 800;
      text-decoration: none;
      border-radius: 8px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      transition: all 0.2s ease;
    }
    .btn:hover {
      background-color: #ffffff;
      box-shadow: 0 0 15px rgba(102, 252, 241, 0.4);
    }
    .loader {
      display: inline-block;
      width: 1.5rem;
      height: 1.5rem;
      border: 2px solid rgba(255, 255, 255, 0.1);
      border-radius: 50%;
      border-top-color: var(--text-highlight);
      animation: spin 1s ease-in-out infinite;
      margin-bottom: 1.25rem;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>

  <script type="text/javascript">
    window.location.replace("https://pavanbadempet-movie-rec-api.hf.space/");
  </script>
</head>
<body>
  <div class="container">
    <div class="loader"></div>
    <h1>Movie Recommendation System</h1>
    <p>Connecting to the 6-Model Hybrid Recommendation Engine on Hugging Face Spaces...</p>
    <a href="https://pavanbadempet-movie-rec-api.hf.space/" class="btn">Launch Application</a>
  </div>
</body>
